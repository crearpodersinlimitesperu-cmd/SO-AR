name: Nodus CRM Hourly Delta Sync (CausaNodusCRMSyncAgent)

on:
  schedule:
    # Ejecución automática cada hora exacta en el minuto 0
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Forzar sincronización completa ignorando ventana delta'
        required: false
        default: 'false'

concurrency:
  group: nodus-crm-hourly-sync
  cancel-in-progress: false

jobs:
  hourly-delta-sync:
    name: Delta Sync Horario (CausaNodusCRMSyncAgent)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Execute Autonomous CausaNodusCRMSyncAgent
        env:
          NODUS_USER: ${{ secrets.NODUS_USER }}
          NODUS_PASSWORD: ${{ secrets.NODUS_PASSWORD }}
          NODUS_ROBOT_SECRET: ${{ secrets.NODUS_ROBOT_SECRET || 'NODUS_ROBOT_CPSL_2026_SECRET' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FORCE_FULL_SYNC: ${{ github.event.inputs.force_full || 'false' }}
        run: node scripts/CausaNodusCRMSyncAgent.mjs

      - name: Audit Trail Notification
        if: success()
        run: echo "🎉 Delta Sync Horario completado exitosamente a las $(date)"

      - name: Fallback Notification on Error
        if: failure()
        run: echo "⚠️ Alerta silenciosa: Falla en ventana horaria Nodus. Snapshots en Firestore preservados intactos."
