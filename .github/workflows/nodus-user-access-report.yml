name: NODUS user access and statistics report

on:
  workflow_dispatch:
    inputs:
      run_report:
        description: "Iniciar sesión en Nodus y publicar el reporte; déjalo desactivado para ejecutar solo las pruebas."
        required: false
        type: boolean
        default: false

concurrency:
  group: nodus-hourly-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Validate NODUS user report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Test read-only extraction and data integrity
        run: node --test tests/nodusUserAccessAgent.test.mjs tests/nodusArchiveAgent.test.mjs
      - name: Build Causa OS
        run: npm run build
      - name: Install Chromium for authenticated report
        if: ${{ inputs.run_report == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          npx puppeteer browsers install chrome
      - name: Read account list and publish verified report
        if: ${{ inputs.run_report == true }}
        env:
          NODUS_USER: ${{ secrets.NODUS_USER }}
          NODUS_PASSWORD: ${{ secrets.NODUS_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/nodusUserAccessAgent.mjs
