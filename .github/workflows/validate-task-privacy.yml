name: Validate task privacy and build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/nodusMultiAgentSync.mjs'
      - 'scripts/mailQueue.js'
      - 'scripts/sync_drive_vuelos_7xdia.py'
      - 'public/flight-tracker.js'
      - 'public/cartas/flight-tracker.js'
      - 'scripts/mailerDaemon.js'
      - 'scripts/publishNodusReportSources.mjs'
      - 'scripts/tests/nodus-report-rules.test.mjs'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/validate-task-privacy.yml'
      - '.github/workflows/mail-dispatch.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run tests
        run: npm test && npm run test:flyer-teams && npm run test:nodus-reports && npm run test:flight-monitor && node --test tests/logistics-help-deploy.test.mjs tests/logistics-help-browser.test.mjs tests/home-module-help.test.mjs

      - name: Build production app
        run: npm run build

      - name: Test Firestore security rules in Emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-task-privacy "npm run test:rules && node --test scripts/tests/nodus-report-rules.test.mjs"
