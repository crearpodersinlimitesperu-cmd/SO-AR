name: Agente Guardián de Sincronización Asignador ↔ Calendario Global

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - master
    paths:
      - 'src/pages/AsignadorEntrenadores.jsx'
      - 'src/services/trainerCalendarSyncAgent.js'
      - 'public/calendario_global.html'
      - 'scripts/publishCalendarAssignmentProjection.mjs'
      - '.github/workflows/publish-calendar-assignment-projection.yml'

concurrency:
  group: calendar-assignment-projection
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ejecutar Agente Guardián de Sincronización Asignador ↔ Calendario Global
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/publishCalendarAssignmentProjection.mjs
