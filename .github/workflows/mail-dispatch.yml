name: 📧 Mail Dispatch & Inactivity Alerts

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  mail-dispatch:
    name: Process Mail Queue & Inactivity Alerts
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --include=optional

      # (03/09/2026) FIX — mailerDaemon.js pasó a usar firebase-admin (ver
      # comentario al inicio de ese archivo): desde el endurecimiento de
      # firestore.rules del 26/08/2026, el SDK de cliente sin sesión iniciada
      # no podía leer/escribir mail, user_profiles ni tasks ("Missing or
      # insufficient permissions" en las 3), y las notificaciones llevaban
      # semanas sin enviarse. Mismo patrón exacto que ya usa
      # managers-llamados-sync.yml: escribir la Service Account desde el
      # Secret ya existente GOOGLE_SERVICE_ACCOUNT_JSON, y borrarla al final
      # del job pase lo que pase.
      - name: 🔑 Escribir la llave de la Service Account
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > centro-operativo-cpsl-65ad52160f45.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: 🚀 Run Mailer Daemon (One-Shot)
        env:
          GMAIL_SERVER_EMAIL: ${{ secrets.GMAIL_USER }}
          GMAIL_SERVER_APP_PASSWORD: ${{ secrets.GMAIL_PASS }}
        run: |
          node scripts/mailerDaemon.js --one-shot

      - name: 🗑️ Borrar la llave del runner
        if: always()
        run: rm -f centro-operativo-cpsl-65ad52160f45.json
