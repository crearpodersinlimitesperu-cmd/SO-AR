name: 📧 Mail Dispatch & Inactivity Alerts

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  mail-dispatch:
    name: Process Mail Queue & Inactivity Alerts
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --include=optional

      # (03/09/2026) FIX — mailerDaemon.js pasó a usar firebase-admin (ver
      # comentario al inicio de ese archivo): desde el endurecimiento de
      # firestore.rules del 26/08/2026, el SDK de cliente sin sesión iniciada
      # no podía leer/escribir mail, user_profiles ni tasks ("Missing or
      # insufficient permissions" en las 3), y las notificaciones llevaban
      # semanas sin enviarse. Mismo patrón exacto que ya usa
      # managers-llamados-sync.yml: escribir la Service Account desde el
      # Secret ya existente GOOGLE_SERVICE_ACCOUNT_JSON, y borrarla al final
      # del job pase lo que pase.
      - name: 🔑 Escribir la llave de la Service Account
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > centro-operativo-cpsl-65ad52160f45.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # (03/09/2026) DIAGNÓSTICO — José: el run #224 falló con
      # "SyntaxError: Unexpected end of JSON input" al leer este archivo,
      # lo que indica que quedó vacío (o solo con un salto de línea) — es
      # decir, el Secret GOOGLE_SERVICE_ACCOUNT_JSON llegó vacío a este job.
      # Este paso NO imprime el contenido del secreto (eso violaría la
      # regla de nunca exponer credenciales) — solo confirma, con datos
      # objetivos (tamaño en bytes y si el JSON es válido), si el archivo
      # quedó bien escrito ANTES de intentar usarlo. Si vuelve a fallar
      # aquí, confirma que el Secret está vacío/ausente en este repositorio
      # — no es un bug del código.
      - name: 🩺 Verificar que la llave se escribió correctamente
        run: |
          echo "Tamaño del archivo (bytes):"
          wc -c < centro-operativo-cpsl-65ad52160f45.json
          node -e "JSON.parse(require('fs').readFileSync('centro-operativo-cpsl-65ad52160f45.json','utf8')); console.log('✅ JSON válido — la llave se escribió correctamente.')"

      - name: 🚀 Run Mailer Daemon (One-Shot)
        env:
          GMAIL_SERVER_EMAIL: ${{ secrets.GMAIL_USER }}
          GMAIL_SERVER_APP_PASSWORD: ${{ secrets.GMAIL_PASS }}
        run: |
          node scripts/mailerDaemon.js --one-shot

      - name: 🗑️ Borrar la llave del runner
        if: always()
        run: rm -f centro-operativo-cpsl-65ad52160f45.json
