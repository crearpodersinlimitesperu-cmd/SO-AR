name: Zero-Touch Seguros Sentinel (RPA)

on:
  schedule:
    # Corre todos los días a las 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scan_and_update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Zero-Touch Sentinel
        env:
          # Credenciales específicas de la cuenta causa-drive-sync
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          # Utilizamos directamente la credencial de la Caja Negra (causa-drive-sync)
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="sa-key.json"
          node scripts/segurosSentinelAgent.mjs
