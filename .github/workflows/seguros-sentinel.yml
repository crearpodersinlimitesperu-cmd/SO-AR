name: Zero-Touch Seguros Sentinel (RPA)

on:
  schedule:
    # Corre todos los días a las 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scan_and_update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Zero-Touch Sentinel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          # Construir el JSON de la Service Account dinámicamente usando las variables de Firebase ya existentes
          cat <<EOF > sa-key.json
          {
            "type": "service_account",
            "project_id": "${FIREBASE_PROJECT_ID}",
            "private_key": "${FIREBASE_PRIVATE_KEY}",
            "client_email": "${FIREBASE_CLIENT_EMAIL}",
            "client_id": "1234567890",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
            "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/${FIREBASE_CLIENT_EMAIL}"
          }
          EOF
          export GOOGLE_APPLICATION_CREDENTIALS="sa-key.json"
          node scripts/segurosSentinelAgent.mjs
