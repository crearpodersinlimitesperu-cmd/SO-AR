name: 🔍 Auditoría de Plataforma y Nodus

on:
  schedule:
    # Cada 5 horas (dentro del rango "cada 4-6 horas" pedido). El cron ancla
    # en minuto 0; GitHub Actions no garantiza el minuto exacto de disparo,
    # solo que corre aproximadamente en ese intervalo.
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permite correrlo manualmente desde GitHub UI para probarlo

permissions:
  contents: read
  issues: write # Necesario para crear/actualizar el Issue de estado de la auditoría

jobs:
  audit:
    name: Auditoría heurística de Causa OS + Nodus
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install --include=optional

      - name: 🔑 Escribir la llave de la Service Account
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > centro-operativo-cpsl-65ad52160f45.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: 🩺 Verificar que la llave se escribió correctamente
        run: |
          echo "Tamaño del archivo (bytes):"
          wc -c < centro-operativo-cpsl-65ad52160f45.json
          node -e "try { JSON.parse(require('fs').readFileSync('centro-operativo-cpsl-65ad52160f45.json','utf8')); console.log('✅ JSON válido — la llave se escribió correctamente.'); } catch(e) { console.log('⚠️ Sin llave JSON válida, continuando en modo seguro.'); }"

      - name: 🔍 Ejecutar auditoría
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/platform_audit.mjs

      - name: 🗑️ Borrar la llave del runner
        if: always()
        run: rm -f centro-operativo-cpsl-65ad52160f45.json
