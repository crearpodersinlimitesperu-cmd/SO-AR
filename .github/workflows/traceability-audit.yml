name: Nodus Traceability & Trust Agent

on:
  schedule:
    # Corre todos los días a las 05:00 UTC (Media noche aprox en LatAm)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Traceability Agent
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/nodusTraceabilityAgent.mjs
