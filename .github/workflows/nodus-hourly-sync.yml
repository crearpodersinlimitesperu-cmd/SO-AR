name: Nodus Hourly Autonomous Multi-Agent Sync

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: nodus-hourly-sync
  cancel-in-progress: false

jobs:
  sync-nodus-hourly:
    name: Sincronización Horaria Nodus Multi-Agente
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium & Puppeteer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          npx puppeteer browsers install chrome || true

      - name: Execute Autonomous Multi-Agent Pipeline
        env:
          NODUS_USER: ${{ secrets.NODUS_USER }}
          NODUS_PASSWORD: ${{ secrets.NODUS_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: node scripts/nodusMultiAgentSync.mjs

      - name: Notify Success
        if: success()
        run: echo "✅ Sincronización horaria Nodus ejecutada exitosamente a las $(date)"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Fallo en sincronización horaria Nodus a las $(date)"
