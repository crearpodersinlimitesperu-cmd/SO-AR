name: Aplicar identidades confirmadas

on:
  workflow_dispatch:

concurrency:
  group: apply-confirmed-identities
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Marcar solo las equivalencias aprobadas con auditoría reversible
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/applyConfirmedIdentityAliases.mjs
