name: IMO Firebase backend readiness (read only)
on:
  workflow_dispatch:
    inputs:
      nodus_reports:
        type: boolean
        default: false
        description: Include aggregate read-only evidence for coordinator reports
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --include=optional
      - name: Read infrastructure and private schema metadata
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/auditImoFirebaseBackend.mjs
      - name: Read Nodus report evidence without personal data
        if: inputs.nodus_reports
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/publishNodusReportSources.mjs
