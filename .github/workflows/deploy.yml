name: 🚀 Deploy to Firebase Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch: # Permite lanzar manualmente desde GitHub UI

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # CONTEXTO (28/08/2026): se quitó "cache: 'npm'" porque el build falló 2
          # veces seguidas (run 33206219486, intento 1 y 2) en el paso siguiente con
          # "Rolldown failed to resolve import recharts" / "Cannot find native binding"
          # — el mismo error que reproduje localmente con un node_modules con caché
          # incompleta de un paquete opcional específico de plataforma (rolldown).
          # Es el bug conocido de npm con dependencias opcionales
          # (https://github.com/npm/cli/issues/4828). Con una instalación 100% limpia
          # (sin caché de npm) el build sí funcionó, dos veces, en mi entorno.
          # No pude confirmar el error exacto de CI porque el log crudo de GitHub
          # Actions redirige a productionresultssa19.blob.core.windows.net, dominio
          # bloqueado por la política de red de esta sesión — así que esto es una
          # hipótesis fundamentada, no un hecho confirmado con el log real. Si el
          # build vuelve a fallar después de este cambio, hay que revisar el log
          # directamente desde github.com/.../actions (interfaz web) para descartar
          # otra causa.

      - name: 📦 Instalar dependencias
        run: npm install --include=optional

      - name: 🔨 Build de producción
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_QT_SHEET_CSV_URL: ${{ secrets.VITE_QT_SHEET_CSV_URL }}
          VITE_COPILOTO_WORKER_URL: ${{ secrets.VITE_COPILOTO_WORKER_URL }}
        run: npm run build

      - name: 🚀 Deploy to Firebase Hosting
        env:
          RAW_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$RAW_TOKEN" ]; then
            TOKEN="$RAW_TOKEN"
            if [[ "$TOKEN" != 1//* ]]; then
              TOKEN="1//$TOKEN"
            fi
            echo "Deploying to Firebase Hosting with formatted token..."
            npx --yes firebase-tools@latest deploy --only hosting --token "$TOKEN" --project centro-operativo-cpsl --non-interactive
          else
            echo "FIREBASE_TOKEN not set, skipping hosting deploy."
          fi
