name: Guardián de Temas y Legibilidad Global

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/theme-legibility-all-modules.test.mjs'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/theme-legibility-all-modules.test.mjs'
  workflow_dispatch:

jobs:
  audit-theme-legibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditar presencia de temas/refresh y legibilidad en todos los módulos
        run: node --test tests/theme-legibility-all-modules.test.mjs
