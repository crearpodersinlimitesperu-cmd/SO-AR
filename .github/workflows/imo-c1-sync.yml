name: Sync verified C1 availability for IMO
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Publish minimum C1 evidence to existing IMO projections
        type: boolean
        default: false
  workflow_run:
    workflows: [Nodus Hourly Autonomous Multi-Agent Sync]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: imo-c1-availability
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --include=optional
      - run: node --test scripts/tests/imo-c1-eligibility.test.mjs scripts/tests/imo-c1-reconciliation.test.mjs
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Read source and reconcile explicit C1 evidence
        env:
          NODUS_USER: ${{ secrets.NODUS_USER }}
          NODUS_PASSWORD: ${{ secrets.NODUS_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          APPLY_C1: ${{ github.event_name == 'workflow_run' || inputs.apply }}
        run: |
          if [ "$APPLY_C1" = "true" ]; then
            node scripts/syncImoC1Eligibility.mjs --apply
          else
            node scripts/syncImoC1Eligibility.mjs
          fi
